name: CKT22 Monitor

on:
  schedule:
    - cron: '* * * * *'

  workflow_dispatch:

jobs:
  check:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5

    - name: Install
      run: pip install -r requirements.txt

    - name: Run Monitor
      run: python monitor.py
